name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v5
        with:
          version: 12.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      # build, including the type declarations that the consumer check below reads
      - run: pnpm run build
      # compile a file that only uses the public declarations, in strict mode: nothing public may be missing or internal
      - run: pnpm run typecheck:consumer
      # the tests render with Mojang's official resources, downloaded into .cache/ once per listed release
      - uses: actions/cache@v4
        with:
          path: .cache
          key: bedrock-samples-${{ hashFiles('example/public/packs/bedrock-samples-*.json') }}
      - run: pnpm test
