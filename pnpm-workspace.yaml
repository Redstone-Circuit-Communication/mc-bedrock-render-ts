# A single-package repository: this file only holds pnpm settings (as in the Java renderer).
packages: []
# Since pnpm 10, install scripts of dependencies do not run by default, and pnpm 12 fails on unapproved ones
# (ERR_PNPM_IGNORED_BUILDS). esbuild's install script (used by the build script and by Vite) only checks for and fetches
# the binary for the current platform, so it is allowed.
allowBuilds:
  esbuild: true
